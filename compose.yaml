services:
  app:
    build: .
    container_name: agentshield-app
    env_file:
      - .env
    environment:
      AGENTSHIELD_DEV_DATABASE_URL: postgresql+psycopg://${AGENTSHIELD_DEV_DB_USER}:${AGENTSHIELD_DEV_DB_PASSWORD}@postgres-dev:5432/${AGENTSHIELD_DEV_DB_NAME}
      AGENTSHIELD_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: agentshield-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-dev:
    image: postgres:16
    container_name: agentshield-postgres-dev
    environment:
      POSTGRES_USER: ${AGENTSHIELD_DEV_DB_USER}
      POSTGRES_PASSWORD: ${AGENTSHIELD_DEV_DB_PASSWORD}
      POSTGRES_DB: ${AGENTSHIELD_DEV_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - agentshield_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENTSHIELD_DEV_DB_USER} -d ${AGENTSHIELD_DEV_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:16
    container_name: agentshield-postgres-test
    environment:
      POSTGRES_USER: ${AGENTSHIELD_TEST_DB_USER}
      POSTGRES_PASSWORD: ${AGENTSHIELD_TEST_DB_PASSWORD}
      POSTGRES_DB: ${AGENTSHIELD_TEST_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - agentshield_test_data:/var/lib/postgresql/data

volumes:
  agentshield_dev_data:
  agentshield_test_data:
